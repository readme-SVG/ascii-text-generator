name: Llama Auto-Issue Generator

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, labeled]

permissions: read-all

concurrency:
  group: ai-issue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      # The analysis script is always taken from the default branch, never from the event's
      # head. Otherwise a pull request could modify the script and read the secrets below.
      - name: Checkout trusted analysis script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir PyGithub==2.5.0 requests==2.32.3

      - name: Run AI Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          ALLOWED_USER: ${{ secrets.ALLOWED_USER }}
        run: python "trigger action/trigger_action.py"
