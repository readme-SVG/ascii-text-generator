name: Lint and Static Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the default pull_request checkout (merge commit). Checking out head_ref
          # fails for pull requests opened from forks, because that branch is not in this repo.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json found. Skipping npm install."
            exit 0
          fi
          if [ -f package-lock.json ]; then
            echo "package-lock.json found. Running fast install (npm ci)..."
            npm ci
          else
            echo "package-lock.json NOT found. Generating it (npm install)..."
            npm install --no-audit --no-fund
          fi

      - name: Run project lint script when available
        run: |
          if [ -f package.json ]; then
            npm run lint --if-present
          else
            echo "No package.json found. Skipping lint."
          fi

      - name: Validate JavaScript syntax
        run: |
          if [ -d api ]; then
            while IFS= read -r -d '' file; do
              node --check "$file"
            done < <(find api -type f -name '*.js' -print0)
          else
            echo "No api/ directory found. Skipping JavaScript syntax validation."
          fi
